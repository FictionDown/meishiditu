services:
  - type: web
    name: meishiditu
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AMAP_KEY
        sync: false
      - key: VITE_AMAP_KEY
        sync: false
      - key: VITE_AMAP_SECURITY_CODE
        sync: false
